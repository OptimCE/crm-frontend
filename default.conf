# Static server for the built Angular bundle.
#
# This mirrors the stock nginx default.conf, plus ONE addition: an explicit
# JavaScript MIME type for `.mjs`.
#
# nginx 1.29's bundled mime.types maps `js` and nothing else, so a `.mjs` file
# is served as application/octet-stream. Browsers refuse to execute a module
# worker with a non-JavaScript MIME type, and maplibre-gl v6 loads its worker
# from `maplibre/maplibre-gl-worker.mjs`. The symptom is not an error anyone
# would connect to MIME types: the map container renders, the controls work, and
# no tile ever appears.
#
# Deliberately NO `try_files ... /index.html` here. SPA deep links are handled
# upstream by the reverse proxy with `proxy_intercept_errors on;` and
# `error_page 404 = @angular_spa_fallback;` (see
# nginx/conf-template.d/default-*.template.conf), which depends on this server
# still answering 404 for an unknown path.

server {
    listen       80;
    server_name  localhost;

    # `types { }` empties the inherited map for this location only, so
    # default_type wins. Scoped to the location so nothing else is affected.
    location ~* \.mjs$ {
        root   /usr/share/nginx/html;
        types  { }
        default_type application/javascript;
    }

    # Files that change on every deploy under the SAME url must be revalidated.
    #
    # Without a Cache-Control header a browser caches by heuristic: a file whose
    # Last-Modified is a day old counts as fresh for about two hours and is reused
    # without asking. The hashed bundles are safe (a new build is a new url), but
    # the translation files are not: after a deploy that added keys, a reload
    # fetched the new JavaScript and kept yesterday's fr.json, and the new screens
    # showed raw keys ("LIVE_DATA.CHART.EXPORT", 2026-10-04). Nor is index.html,
    # which names the bundles. `no-cache` still stores; it only revalidates, and
    # the ETag makes an unchanged file a 304.
    location ^~ /assets/i18n/ {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
