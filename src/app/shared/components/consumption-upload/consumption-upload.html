<form [formGroup]="formGroup" (ngSubmit)="submit()">
  <input
    #fileInput
    type="file"
    id="consumptionFileInput"
    [accept]="accept()"
    (change)="onFileSelected($event)"
    class="file-input"
    data-testid="consumption-upload__input--file"
  />
  <label for="consumptionFileInput" class="file-upload-message">
    <div
      class="file-upload"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)"
      [class.dragging]="dragging()"
      data-testid="consumption-upload__dropzone"
    >
      <i class="pi pi-cloud-upload text-2xl mb-2"></i>
      <p class="m-0">
        {{
          'SHARING_OPERATION.VIEW.CONSUMPTION_MONITORING.SELECT_FILE_DRAG_N_DROP_LABEL' | translate
        }}
      </p>
    </div>
  </label>
  @if (fileConsumption()) {
    <div class="mt-3 flex items-center gap-2" data-testid="consumption-upload__file--selected">
      <i class="pi pi-file text-primary-500"></i>
      <span class="text-sm text-surface-700">{{ fileConsumption()!.name }}</span>
    </div>
  }
  <div class="flex flex-col mt-3 items-center gap-2">
    <app-error-handler controlName="fileConsumption"></app-error-handler>
    <p-button
      type="submit"
      icon="pi pi-upload"
      severity="success"
      [loading]="uploading()"
      label="{{ 'SHARING_OPERATION.VIEW.CONSUMPTION_MONITORING.UPLOAD_BUTTON_LABEL' | translate }}"
      data-testid="consumption-upload__btn--upload"
    ></p-button>
  </div>
</form>
