<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium" for="payment-amount">{{
      'BILLING.PAYMENT_DIALOG.AMOUNT' | translate
    }}</label>
    <input
      pInputText
      id="payment-amount"
      formControlName="amount"
      class="w-full"
      inputmode="decimal"
      placeholder="0.00"
      data-testid="payment-dialog__input--amount"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium" for="payment-method">{{
      'BILLING.PAYMENT_DIALOG.METHOD' | translate
    }}</label>
    <p-select
      inputId="payment-method"
      formControlName="method"
      [options]="methodOptions"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
      styleClass="w-full"
      data-testid="payment-dialog__select--method"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium" for="payment-reference">{{
      'BILLING.PAYMENT_DIALOG.REFERENCE' | translate
    }}</label>
    <input pInputText id="payment-reference" formControlName="reference" class="w-full" />
  </div>

  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium" for="payment-paid-on">{{
      'BILLING.PAYMENT_DIALOG.PAID_ON' | translate
    }}</label>
    <p-datepicker
      inputId="payment-paid-on"
      formControlName="paid_on"
      dateFormat="dd/mm/yy"
      appendTo="body"
      styleClass="w-full"
      [showIcon]="true"
      data-testid="payment-dialog__datepicker--paid-on"
    />
  </div>

  @if (formError()) {
    <p class="text-red-600 text-sm m-0">
      <i class="pi pi-exclamation-circle"></i> {{ formError() }}
    </p>
  }

  <div class="flex justify-end gap-2 mt-2">
    <p-button
      type="button"
      text
      severity="secondary"
      [label]="'COMMON.ACTIONS.CANCEL' | translate"
      [disabled]="submitting()"
      (onClick)="close()"
    />
    <p-button
      type="submit"
      [label]="'BILLING.PAYMENT_DIALOG.SUBMIT' | translate"
      [loading]="submitting()"
      data-testid="payment-dialog__btn--submit"
    />
  </div>
</form>
