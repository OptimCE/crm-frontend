<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium" for="tariff-kind">{{
      'BILLING.TARIFF_DIALOG.KIND' | translate
    }}</label>
    <p-select
      inputId="tariff-kind"
      formControlName="kind"
      [options]="kindOptions"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
      styleClass="w-full"
      data-testid="tariff-dialog__select--kind"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium" for="tariff-scope">{{
      'BILLING.TARIFF_DIALOG.SCOPE' | translate
    }}</label>
    <p-select
      inputId="tariff-scope"
      formControlName="scope"
      [options]="scopeOptions"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
      styleClass="w-full"
      data-testid="tariff-dialog__select--scope"
    />
  </div>

  @if (isSegment()) {
    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium" for="tariff-segment">{{
        'BILLING.TARIFF_DIALOG.SEGMENT' | translate
      }}</label>
      <p-select
        inputId="tariff-segment"
        formControlName="scope_segment"
        [options]="segmentOptions"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
        styleClass="w-full"
      />
    </div>
  }

  @if (isEan()) {
    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium" for="tariff-ean">{{
        'BILLING.TARIFF_DIALOG.EAN' | translate
      }}</label>
      <input pInputText id="tariff-ean" formControlName="scope_ean" class="w-full" />
    </div>
  }

  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium" for="tariff-price">{{
      'BILLING.TARIFF_DIALOG.PRICE' | translate
    }}</label>
    <input
      pInputText
      id="tariff-price"
      formControlName="price_per_kwh"
      class="w-full"
      inputmode="decimal"
      placeholder="0.1200"
      data-testid="tariff-dialog__input--price"
    />
  </div>

  <div class="flex flex-col gap-3 sm:flex-row">
    <div class="flex flex-col gap-1 flex-1">
      <label class="text-sm font-medium" for="tariff-valid-from">{{
        'BILLING.TARIFF_DIALOG.VALID_FROM' | translate
      }}</label>
      <p-datepicker
        inputId="tariff-valid-from"
        formControlName="valid_from"
        dateFormat="dd/mm/yy"
        appendTo="body"
        styleClass="w-full"
        [showIcon]="true"
        data-testid="tariff-dialog__datepicker--valid-from"
      />
    </div>
    <div class="flex flex-col gap-1 flex-1">
      <label class="text-sm font-medium" for="tariff-valid-to">{{
        'BILLING.TARIFF_DIALOG.VALID_TO' | translate
      }}</label>
      <p-datepicker
        inputId="tariff-valid-to"
        formControlName="valid_to"
        dateFormat="dd/mm/yy"
        appendTo="body"
        styleClass="w-full"
        [showIcon]="true"
      />
    </div>
  </div>

  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium" for="tariff-label">{{
      'BILLING.TARIFF_DIALOG.LABEL' | translate
    }}</label>
    <input
      pInputText
      id="tariff-label"
      formControlName="label"
      class="w-full"
      data-testid="tariff-dialog__input--label"
    />
  </div>

  @if (formError()) {
    <p class="text-red-600 text-sm m-0">
      <i class="pi pi-exclamation-circle"></i> {{ formError() }}
    </p>
  }

  <div class="flex justify-end gap-2 mt-2">
    <p-button
      type="button"
      text
      severity="secondary"
      [label]="'COMMON.ACTIONS.CANCEL' | translate"
      [disabled]="submitting()"
      (onClick)="close()"
    />
    <p-button
      type="submit"
      [label]="'BILLING.TARIFF_DIALOG.SUBMIT' | translate"
      [loading]="submitting()"
      data-testid="tariff-dialog__btn--submit"
    />
  </div>
</form>
