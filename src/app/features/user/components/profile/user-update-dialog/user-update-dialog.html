<form
  data-testid="user-update-dialog__form"
  [formGroup]="formData"
  (submit)="submitForm()"
  class="w-full"
>
  <!-- Personal Information Section -->
  <h4 class="text-sm font-semibold uppercase tracking-wide text-surface-500 mb-3">
    {{ 'PROFILE.PERSONAL_INFORMATION.TITLE' | translate }}
  </h4>

  <!-- NRN -->
  <div class="field">
    <label for="nrn" class="text-sm font-medium mb-1">
      {{ 'PROFILE.UPDATE_PROFILE.SOCIAL_NUMBER' | translate }}
    </label>
    <input
      data-testid="user-update-dialog__input--nrn"
      pInputText
      type="text"
      name="nrn"
      id="nrn"
      class="w-full"
      placeholder="{{ 'PROFILE.UPDATE_PROFILE.SOCIAL_NUMBER_PLACEHOLDER' | translate }}"
      formControlName="id"
    />
  </div>

  <!-- Surname / First name -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="field">
      <label for="surname" class="text-sm font-medium mb-1">
        {{ 'PROFILE.UPDATE_PROFILE.SURNAME' | translate }}
      </label>
      <input
        data-testid="user-update-dialog__input--surname"
        pInputText
        type="text"
        name="surname"
        id="surname"
        class="w-full"
        placeholder="{{ 'PROFILE.UPDATE_PROFILE.SURNAME_PLACEHOLDER' | translate }}"
        formControlName="surname"
      />
    </div>

    <div class="field">
      <label for="name" class="text-sm font-medium mb-1">
        {{ 'PROFILE.UPDATE_PROFILE.FIRST_NAME' | translate }}
      </label>
      <input
        data-testid="user-update-dialog__input--first-name"
        pInputText
        type="text"
        name="name"
        id="name"
        class="w-full"
        placeholder="{{ 'PROFILE.UPDATE_PROFILE.FIRST_NAME_PLACEHOLDER' | translate }}"
        formControlName="name"
      />
    </div>
  </div>

  <!-- Phone -->
  <div class="field">
    <label for="phone" class="text-sm font-medium mb-1">
      {{ 'PROFILE.UPDATE_PROFILE.PHONE_NUMBER' | translate }}
    </label>
    <input
      data-testid="user-update-dialog__input--phone"
      pInputText
      type="text"
      name="phone"
      id="phone"
      class="w-full"
      placeholder="{{ 'PROFILE.UPDATE_PROFILE.PHONE_NUMBER_PLACEHOLDER' | translate }}"
      formControlName="phone"
    />
  </div>

  <!-- Banking Section -->
  <p-divider />
  <h4 class="text-sm font-semibold uppercase tracking-wide text-surface-500 mb-3">
    {{ 'PROFILE.TABS.HEADERS.BANKING_INFORMATIONS' | translate }}
  </h4>

  <div class="field">
    <label for="iban" class="text-sm font-medium mb-1">
      {{ 'PROFILE.UPDATE_PROFILE.IBAN' | translate }}
    </label>
    <input
      data-testid="user-update-dialog__input--iban"
      pInputText
      type="text"
      name="iban"
      id="iban"
      class="w-full"
      placeholder="{{ 'PROFILE.UPDATE_PROFILE.IBAN_PLACEHOLDER' | translate }}"
      formControlName="iban"
    />
  </div>

  <!-- Home Address Section -->
  <p-divider />
  <h4 class="text-sm font-semibold uppercase tracking-wide text-surface-500 mb-3">
    {{ 'PROFILE.UPDATE_PROFILE.HOUSE_ADDRESS' | translate }}
  </h4>

  <app-address-autocomplete
    class="block mb-3"
    [source]="homeSource()"
    [probe]="probeHome()"
    testId="user-update-dialog__autocomplete--home"
    (addressPicked)="onHomePicked($event)"
    (geoChange)="homePick.observe($event)"
  />
  <!--
    One grid, not the two it replaces. The five fields used to be split across a
    3-column grid and a 2-column one, so street was no wider than the house
    number and the two rows sat flush against each other — neither grid could
    see the other's row gap.
  -->
  <div class="address-grid grid grid-cols-12 gap-x-4 gap-y-3">
    <div class="field col-span-12 md:col-span-6">
      <label for="home_address_street" class="text-sm font-medium mb-1">
        {{ 'PROFILE.UPDATE_PROFILE.STREET_NAME' | translate }}
      </label>
      <input
        data-testid="user-update-dialog__input--home-street"
        pInputText
        formControlName="home_address_street"
        id="home_address_street"
        class="w-full"
        placeholder="{{ 'PROFILE.UPDATE_PROFILE.STREET_NAME_PLACEHOLDER' | translate }}"
      />
    </div>

    <div class="field col-span-6 md:col-span-3">
      <label for="home_address_number" class="text-sm font-medium mb-1">
        {{ 'PROFILE.UPDATE_PROFILE.NUMBER' | translate }}
      </label>
      <input
        data-testid="user-update-dialog__input--home-number"
        pInputText
        formControlName="home_address_number"
        id="home_address_number"
        class="w-full"
        placeholder="{{ 'PROFILE.UPDATE_PROFILE.NUMBER_PLACEHOLDER' | translate }}"
      />
    </div>

    <div class="field col-span-6 md:col-span-3">
      <label for="home_address_supplement" class="text-sm font-medium mb-1">
        {{ 'PROFILE.UPDATE_PROFILE.BOX' | translate }}
      </label>
      <input
        data-testid="user-update-dialog__input--home-supplement"
        pInputText
        formControlName="home_address_supplement"
        id="home_address_supplement"
        class="w-full"
        placeholder="{{ 'PROFILE.UPDATE_PROFILE.BOX_PLACEHOLDER' | translate }}"
      />
    </div>

    <div class="field col-span-4 md:col-span-3">
      <label for="home_address_postcode" class="text-sm font-medium mb-1">
        {{ 'PROFILE.UPDATE_PROFILE.POSTAL_CODE' | translate }}
      </label>
      <input
        data-testid="user-update-dialog__input--home-postcode"
        pInputText
        formControlName="home_address_postcode"
        id="home_address_postcode"
        class="w-full"
        placeholder="{{ 'PROFILE.UPDATE_PROFILE.POSTAL_CODE_PLACEHOLDER' | translate }}"
      />
    </div>

    <div class="field col-span-8 md:col-span-9">
      <label for="home_address_city" class="text-sm font-medium mb-1">
        {{ 'PROFILE.UPDATE_PROFILE.CITY' | translate }}
      </label>
      <input
        data-testid="user-update-dialog__input--home-city"
        pInputText
        formControlName="home_address_city"
        id="home_address_city"
        class="w-full"
        placeholder="{{ 'PROFILE.UPDATE_PROFILE.CITY_PLACEHOLDER' | translate }}"
      />
    </div>
  </div>

  <!-- Same address checkbox -->
  <div class="mt-3 flex items-center gap-2">
    <p-checkbox
      data-testid="user-update-dialog__checkbox--same-address"
      formControlName="same_address"
      [value]="true"
      (onChange)="toggleSameAddress($event)"
      inputId="sameAddress"
    ></p-checkbox>
    <label for="sameAddress" class="text-sm">
      {{ 'PROFILE.UPDATE_PROFILE.SAME_ADDRESS' | translate }}
    </label>
  </div>

  <!-- Billing Address Section -->
  @if (!isSameAddress()) {
    <p-divider />
    <h4 class="text-sm font-semibold uppercase tracking-wide text-surface-500 mb-3">
      {{ 'PROFILE.UPDATE_PROFILE.BILLING_ADDRESS' | translate }}
    </h4>

    <app-address-autocomplete
      class="block mb-3"
      [source]="billingSource()"
      [probe]="probeBilling()"
      [disabled]="isSameAddress()"
      testId="user-update-dialog__autocomplete--billing"
      (addressPicked)="onBillingPicked($event)"
      (geoChange)="billingPick.observe($event)"
    />
    <!-- Merged from two grids, exactly as the home block above. -->
    <div class="address-grid grid grid-cols-12 gap-x-4 gap-y-3">
      <div class="field col-span-12 md:col-span-6">
        <label for="billing_address_street" class="text-sm font-medium mb-1">
          {{ 'PROFILE.UPDATE_PROFILE.STREET_NAME' | translate }}
        </label>
        <input
          data-testid="user-update-dialog__input--billing-street"
          pInputText
          formControlName="billing_address_street"
          id="billing_address_street"
          class="w-full"
          placeholder="{{ 'PROFILE.UPDATE_PROFILE.STREET_NAME_PLACEHOLDER' | translate }}"
        />
      </div>

      <div class="field col-span-6 md:col-span-3">
        <label for="billing_address_number" class="text-sm font-medium mb-1">
          {{ 'PROFILE.UPDATE_PROFILE.NUMBER' | translate }}
        </label>
        <input
          data-testid="user-update-dialog__input--billing-number"
          pInputText
          formControlName="billing_address_number"
          id="billing_address_number"
          class="w-full"
          placeholder="{{ 'PROFILE.UPDATE_PROFILE.NUMBER_PLACEHOLDER' | translate }}"
        />
      </div>

      <div class="field col-span-6 md:col-span-3">
        <label for="billing_address_supplement" class="text-sm font-medium mb-1">
          {{ 'PROFILE.UPDATE_PROFILE.BOX' | translate }}
        </label>
        <input
          data-testid="user-update-dialog__input--billing-supplement"
          pInputText
          formControlName="billing_address_supplement"
          id="billing_address_supplement"
          class="w-full"
          placeholder="{{ 'PROFILE.UPDATE_PROFILE.BOX_PLACEHOLDER' | translate }}"
        />
      </div>

      <div class="field col-span-4 md:col-span-3">
        <label for="billing_address_postcode" class="text-sm font-medium mb-1">
          {{ 'PROFILE.UPDATE_PROFILE.POSTAL_CODE' | translate }}
        </label>
        <input
          data-testid="user-update-dialog__input--billing-postcode"
          pInputText
          formControlName="billing_address_postcode"
          id="billing_address_postcode"
          class="w-full"
          placeholder="{{ 'PROFILE.UPDATE_PROFILE.POSTAL_CODE_PLACEHOLDER' | translate }}"
        />
      </div>

      <div class="field col-span-8 md:col-span-9">
        <label for="billing_address_city" class="text-sm font-medium mb-1">
          {{ 'PROFILE.UPDATE_PROFILE.CITY' | translate }}
        </label>
        <input
          data-testid="user-update-dialog__input--billing-city"
          pInputText
          formControlName="billing_address_city"
          id="billing_address_city"
          class="w-full"
          placeholder="{{ 'PROFILE.UPDATE_PROFILE.CITY_PLACEHOLDER' | translate }}"
        />
      </div>
    </div>
  }

  <!-- Footer -->
  <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-surface-200">
    <p-button
      data-testid="user-update-dialog__button--cancel"
      [text]="true"
      severity="secondary"
      label="{{ 'PROFILE.UPDATE_PROFILE.CANCEL' | translate }}"
      (click)="cancel()"
    />
    <p-button
      data-testid="user-update-dialog__button--submit"
      pRipple
      type="submit"
      icon="pi pi-check"
      label="{{ 'PROFILE.UPDATE_PROFILE.VALIDATE' | translate }}"
    />
  </div>
</form>
