<form
  data-testid="community-dialog__form"
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  class="flex flex-col gap-3"
>
  <div>
    <span class="field-label">{{ 'COMMUNITY.CREATE.NAME' | translate }}</span>
    <input
      data-testid="community-dialog__input--name"
      pInputText
      placeholder="{{ 'COMMUNITY.CREATE.NAME_PLACEHOLDER' | translate }}"
      formControlName="new_name"
      class="w-full"
    />
  </div>
  <div>
    <span class="field-label">{{ 'COMMUNITY_INFO.REGULATOR' | translate }}</span>
    <p-select
      data-testid="community-dialog__select--regulator"
      [options]="regulatorOptions()"
      formControlName="regulator"
      optionLabel="label"
      optionValue="code"
      appendTo="body"
      styleClass="w-full"
      [placeholder]="'COMMUNITY_INFO.REGULATOR_PLACEHOLDER' | translate"
    />
  </div>
  <p-button
    data-testid="community-dialog__button--submit"
    label="{{ 'COMMUNITY.CREATE.VALIDATE' | translate }}"
    type="submit"
    severity="primary"
    class="w-full"
  />
</form>
