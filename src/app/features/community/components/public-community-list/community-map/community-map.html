@if (failed()) {
  <div
    class="rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-700"
    data-testid="community-map__error"
  >
    {{ 'COMMON.ERROR_LOADING' | translate }}
  </div>
} @else if (isEmpty()) {
  <div
    class="rounded-xl border border-surface-200 bg-surface-50 py-12 text-center"
    data-testid="community-map__empty"
  >
    <i class="pi pi-map text-3xl text-surface-300 mb-2"></i>
    <p class="font-medium text-surface-700 m-0">{{ 'MAP.EMPTY_TITLE' | translate }}</p>
    <p class="text-sm text-surface-500 mt-1 m-0">{{ 'MAP.EMPTY_COMMUNITIES' | translate }}</p>
  </div>
} @else {
  <app-map-canvas
    class="community-map__canvas"
    [zones]="zones()"
    fitTo="zones"
    zonesPopupTitleKey="MAP.POPUP.TITLE_ZONES"
    [ariaLabel]="'MAP.REGION_ARIA' | translate"
    data-testid="community-map__canvas"
  />

  <p class="mt-2 text-xs text-surface-500" data-testid="community-map__summary">
    {{ 'MAP.POPUP.COUNT' | translate: { count: communityCount() } }}
  </p>
}
