<app-dashboard-tile
  data-testid="my-documents-tile"
  icon="pi pi-file"
  headingId="dashboard-tile-my-documents"
  [title]="'DASHBOARD.MEMBER.DOCUMENTS.TITLE' | translate"
  [state]="state()"
  (retry)="load()"
>
  <ul class="flex flex-col gap-2 m-0 p-0 list-none">
    @for (document of visible(); track document.id) {
      <li class="flex items-center gap-2 text-sm">
        <i class="pi pi-file text-surface-400 shrink-0" aria-hidden="true"></i>
        <span class="flex-1 min-w-0 truncate text-surface-800">{{ document.file_name }}</span>
        <span class="text-xs text-surface-400 shrink-0">{{ document.upload_date | timeAgo }}</span>
      </li>
    }
  </ul>

  <div tileEmpty data-testid="my-documents-tile__empty">
    <p class="text-sm text-surface-600 m-0">
      {{ 'DASHBOARD.MEMBER.DOCUMENTS.EMPTY' | translate }}
    </p>
  </div>

  <a
    tileAction
    class="text-primary-500 hover:text-primary-700 underline text-sm"
    routerLink="/users"
    data-testid="my-documents-tile__link--all"
  >
    {{ 'DASHBOARD.MEMBER.DOCUMENTS.SEE_ALL' | translate }}
  </a>
</app-dashboard-tile>
