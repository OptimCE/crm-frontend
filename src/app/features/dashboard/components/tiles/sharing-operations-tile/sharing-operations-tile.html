<app-dashboard-tile
  data-testid="sharing-operations-tile"
  icon="pi pi-share-alt"
  headingId="dashboard-tile-operations"
  [title]="'DASHBOARD.MANAGER.OPERATIONS.TITLE' | translate"
  [state]="state()"
  (retry)="retry.emit()"
>
  <ul class="flex flex-col gap-2 m-0 p-0 list-none">
    @for (op of visible(); track op.id) {
      <li class="flex items-center gap-2">
        <a
          class="text-primary-500 hover:text-primary-700 underline text-sm flex-1 min-w-0 truncate"
          [routerLink]="['/sharing_operations', op.id]"
          data-testid="sharing-operations-tile__link--operation"
          >{{ op.name }}</a
        >
        <span class="text-xs text-surface-500 shrink-0">{{ op.type | sharingOperationType }}</span>
      </li>
    }
  </ul>

  <div tileEmpty data-testid="sharing-operations-tile__empty">
    <p class="text-sm text-surface-600 m-0">
      {{ 'DASHBOARD.MANAGER.OPERATIONS.EMPTY' | translate }}
    </p>
  </div>

  <a
    tileAction
    class="text-primary-500 hover:text-primary-700 underline text-sm"
    routerLink="/sharing_operations"
    data-testid="sharing-operations-tile__link--all"
  >
    {{ 'DASHBOARD.MANAGER.OPERATIONS.SEE_ALL' | translate: { count: operations().length } }}
  </a>
</app-dashboard-tile>
