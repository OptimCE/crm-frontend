<form (ngSubmit)="submit()" class="flex flex-col gap-4">
  <p class="text-sm text-surface-600 m-0">
    {{ 'ADMINISTRATIVE_DOCUMENT.PROCEDURES.TRANSITION.INTRO' | translate }}
  </p>

  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium" for="transition-step">{{
      'ADMINISTRATIVE_DOCUMENT.PROCEDURES.TRANSITION.TO_STEP' | translate
    }}</label>
    <p-select
      inputId="transition-step"
      name="toStep"
      [options]="stepOptions"
      [(ngModel)]="toStep"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
      class="w-full"
      [placeholder]="
        'ADMINISTRATIVE_DOCUMENT.PROCEDURES.TRANSITION.TO_STEP_PLACEHOLDER' | translate
      "
      data-testid="procedure-transition-dialog__select--step"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium" for="transition-date">{{
      (targetInForce()
        ? 'ADMINISTRATIVE_DOCUMENT.PROCEDURES.TRANSITION.EFFECTIVE_ON'
        : 'ADMINISTRATIVE_DOCUMENT.PROCEDURES.TRANSITION.ON'
      ) | translate
    }}</label>
    <p-datepicker
      inputId="transition-date"
      name="on"
      [(ngModel)]="on"
      dateFormat="dd/mm/yy"
      appendTo="body"
      [fluid]="true"
      [showIcon]="true"
      [maxDate]="today"
      data-testid="procedure-transition-dialog__date--on"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium" for="transition-reason">{{
      'ADMINISTRATIVE_DOCUMENT.PROCEDURES.TRANSITION.REASON' | translate
    }}</label>
    <textarea
      pTextarea
      id="transition-reason"
      name="reason"
      [(ngModel)]="reason"
      rows="3"
      [maxlength]="reasonMax"
      class="w-full"
      data-testid="procedure-transition-dialog__input--reason"
    ></textarea>
  </div>

  @if (targetInForce()) {
    <p
      class="text-sm text-surface-600 m-0"
      data-testid="procedure-transition-dialog__hint--in-force"
    >
      {{ 'ADMINISTRATIVE_DOCUMENT.PROCEDURES.TRANSITION.IN_FORCE_HINT' | translate }}
    </p>
  }

  @if (formError()) {
    <p class="text-red-600 text-sm m-0" data-testid="procedure-transition-dialog__error">
      <i class="pi pi-exclamation-circle"></i> {{ formError() }}
      @if (conflicts().length > 0) {
        <span class="font-mono" data-testid="procedure-transition-dialog__conflicts">{{
          conflicts().join(', ')
        }}</span>
      }
    </p>
  }

  <div class="flex justify-end gap-2">
    <p-button
      type="button"
      text
      severity="secondary"
      [label]="'COMMON.ACTIONS.CANCEL' | translate"
      [disabled]="submitting()"
      (onClick)="close()"
      data-testid="procedure-transition-dialog__btn--cancel"
    />
    <p-button
      type="submit"
      [label]="'ADMINISTRATIVE_DOCUMENT.PROCEDURES.TRANSITION.SUBMIT' | translate"
      [loading]="submitting()"
      data-testid="procedure-transition-dialog__btn--submit"
    />
  </div>
</form>
