<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
  <!-- Immutable after creation: re-pointing a filed dossier would invalidate
       everything already recorded against it. -->
  <div class="flex flex-col gap-1">
    <span class="field-label">{{
      'ADMINISTRATIVE_DOCUMENT.DIALOGS.CREATE_DOSSIER.OPERATION' | translate
    }}</span>
    <span class="field-value">{{ operationName }}</span>
    <small class="text-surface-500">{{
      'ADMINISTRATIVE_DOCUMENT.DIALOGS.EDIT_DOSSIER.OPERATION_LOCKED' | translate
    }}</small>
  </div>

  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium" for="edit-dossier-title">{{
      'ADMINISTRATIVE_DOCUMENT.DIALOGS.CREATE_DOSSIER.TITLE_FIELD' | translate
    }}</label>
    <input
      pInputText
      id="edit-dossier-title"
      formControlName="title"
      class="w-full"
      maxlength="255"
      data-testid="dossier-edit-dialog__input--title"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium" for="edit-dossier-external-ref">{{
      'ADMINISTRATIVE_DOCUMENT.DIALOGS.CREATE_DOSSIER.EXTERNAL_REF' | translate
    }}</label>
    <input
      pInputText
      id="edit-dossier-external-ref"
      formControlName="external_ref"
      class="w-full"
      maxlength="128"
      data-testid="dossier-edit-dialog__input--external-ref"
    />
  </div>

  @if (formError()) {
    <p class="text-red-600 text-sm m-0" data-testid="dossier-edit-dialog__error">
      <i class="pi pi-exclamation-circle"></i> {{ formError() }}
    </p>
  }

  <div class="flex justify-end gap-2 mt-2">
    <p-button
      type="button"
      text
      severity="secondary"
      [label]="'COMMON.ACTIONS.CANCEL' | translate"
      [disabled]="submitting()"
      (onClick)="close()"
      data-testid="dossier-edit-dialog__btn--cancel"
    />
    <p-button
      type="submit"
      [label]="'ADMINISTRATIVE_DOCUMENT.DIALOGS.EDIT_DOSSIER.SUBMIT' | translate"
      [loading]="submitting()"
      data-testid="dossier-edit-dialog__btn--submit"
    />
  </div>
</form>
