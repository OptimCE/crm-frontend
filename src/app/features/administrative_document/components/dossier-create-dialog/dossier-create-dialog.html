<form (ngSubmit)="submit()" class="flex flex-col gap-4">
  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium" for="dossier-type">{{
      'ADMINISTRATIVE_DOCUMENT.DIALOGS.CREATE_DOSSIER.TYPE' | translate
    }}</label>
    <p-select
      inputId="dossier-type"
      name="code"
      [options]="typeOptions()"
      [ngModel]="code()"
      (ngModelChange)="code.set($event)"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
      class="w-full"
      [placeholder]="'ADMINISTRATIVE_DOCUMENT.DIALOGS.CREATE_DOSSIER.TYPE_PLACEHOLDER' | translate"
      data-testid="dossier-create-dialog__select--type"
    />
  </div>

  @if (needsOperation()) {
    @if (hasNoOperations()) {
      <p class="text-sm text-amber-700 bg-amber-50 border border-amber-200 rounded-lg p-3 m-0">
        <i class="pi pi-exclamation-triangle"></i>
        {{ 'ADMINISTRATIVE_DOCUMENT.DIALOGS.CREATE_DOSSIER.NO_OPERATIONS' | translate }}
      </p>
    }
    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium" for="dossier-operation">{{
        'ADMINISTRATIVE_DOCUMENT.DIALOGS.CREATE_DOSSIER.OPERATION' | translate
      }}</label>
      <p-select
        inputId="dossier-operation"
        name="operation"
        [options]="operationOptions()"
        [(ngModel)]="operation"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
        class="w-full"
        [placeholder]="
          'ADMINISTRATIVE_DOCUMENT.DIALOGS.CREATE_DOSSIER.OPERATION_PLACEHOLDER' | translate
        "
        data-testid="dossier-create-dialog__select--operation"
      />
    </div>
  }

  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium" for="dossier-requested-effect">{{
      'ADMINISTRATIVE_DOCUMENT.PROCEDURES.CREATE.REQUESTED_EFFECT' | translate
    }}</label>
    <p-datepicker
      inputId="dossier-requested-effect"
      name="requestedEffect"
      [(ngModel)]="requestedEffect"
      dateFormat="dd/mm/yy"
      appendTo="body"
      [fluid]="true"
      [showIcon]="true"
      [showClear]="true"
      data-testid="dossier-create-dialog__date--requested-effect"
    />
    <small class="text-surface-500">{{
      'ADMINISTRATIVE_DOCUMENT.PROCEDURES.CREATE.REQUESTED_EFFECT_HINT' | translate
    }}</small>
  </div>

  @if (formError()) {
    <p class="text-red-600 text-sm m-0" data-testid="dossier-create-dialog__error">
      <i class="pi pi-exclamation-circle"></i> {{ formError() }}
    </p>
  }

  <div class="flex justify-end gap-2 mt-2">
    <p-button
      type="button"
      text
      severity="secondary"
      [label]="'COMMON.ACTIONS.CANCEL' | translate"
      [disabled]="submitting()"
      (onClick)="close()"
      data-testid="dossier-create-dialog__btn--cancel"
    />
    <p-button
      type="submit"
      [label]="'ADMINISTRATIVE_DOCUMENT.DIALOGS.CREATE_DOSSIER.SUBMIT' | translate"
      [loading]="submitting()"
      data-testid="dossier-create-dialog__btn--submit"
    />
  </div>
</form>
