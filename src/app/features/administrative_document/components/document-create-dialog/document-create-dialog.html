<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium" for="document-type">{{
      'ADMINISTRATIVE_DOCUMENT.DIALOGS.CREATE_DOCUMENT.DOC_TYPE' | translate
    }}</label>
    <p-select
      inputId="document-type"
      [options]="typeOptions()"
      formControlName="doc_type"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
      class="w-full"
      [loading]="loadingTypes()"
      [filter]="true"
      filterBy="label"
      [placeholder]="
        'ADMINISTRATIVE_DOCUMENT.DIALOGS.CREATE_DOCUMENT.DOC_TYPE_PLACEHOLDER' | translate
      "
      data-testid="document-create-dialog__select--doc-type"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium" for="document-title">{{
      'ADMINISTRATIVE_DOCUMENT.DIALOGS.CREATE_DOCUMENT.TITLE_FIELD' | translate
    }}</label>
    <input
      pInputText
      id="document-title"
      formControlName="title"
      class="w-full"
      maxlength="255"
      data-testid="document-create-dialog__input--title"
    />
  </div>

  @if (formError()) {
    <p class="text-red-600 text-sm m-0" data-testid="document-create-dialog__error">
      <i class="pi pi-exclamation-circle"></i> {{ formError() }}
    </p>
  }

  <div class="flex justify-end gap-2 mt-2">
    <p-button
      type="button"
      text
      severity="secondary"
      [label]="'COMMON.ACTIONS.CANCEL' | translate"
      [disabled]="submitting()"
      (onClick)="close()"
      data-testid="document-create-dialog__btn--cancel"
    />
    <p-button
      type="submit"
      [label]="'ADMINISTRATIVE_DOCUMENT.DIALOGS.CREATE_DOCUMENT.SUBMIT' | translate"
      [loading]="submitting()"
      data-testid="document-create-dialog__btn--submit"
    />
  </div>
</form>
