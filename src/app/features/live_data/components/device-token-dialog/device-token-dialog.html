@if (token; as issued) {
  <div class="flex flex-col gap-4" data-testid="device-token-dialog">
    <!-- First, before the code itself. Someone who closes this dialog without
         reading it has lost the code, and the only recovery is to issue another
         one — which invalidates this one. -->
    <p-message severity="warn" styleClass="block text-sm" data-testid="device-token-dialog__once">
      {{ 'LIVE_DATA.TOKEN.SHOWN_ONCE' | translate }}
    </p-message>

    <div class="flex flex-col items-center gap-3">
      @if (qr) {
        <!-- Rendered server-side by `segno` and delivered inline. A second
             endpoint returning this image would put the credential in the
             gateway's and nginx's access logs. -->
        <img
          [src]="qr"
          alt=""
          class="w-48 h-48 border border-surface-200 rounded-lg bg-white p-2"
          data-testid="device-token-dialog__qr"
        />
      }
      <p class="text-xs text-surface-500 text-center m-0">
        {{ 'LIVE_DATA.TOKEN.SCAN' | translate }}
      </p>
    </div>

    <div class="flex flex-col gap-2">
      <code
        class="block text-center text-lg font-mono tracking-widest bg-surface-100 rounded-lg py-3 select-all break-all"
        data-testid="device-token-dialog__code"
        >{{ issued.token }}</code
      >
      <p-button
        type="button"
        outlined
        size="small"
        icon="pi pi-copy"
        [label]="'LIVE_DATA.TOKEN.COPY' | translate"
        (onClick)="copy()"
        data-testid="device-token-dialog__btn--copy"
      />
    </div>

    <p class="text-xs text-surface-500 m-0 text-center" data-testid="device-token-dialog__expires">
      {{ 'LIVE_DATA.TOKEN.EXPIRES' | translate: { date: issued.expires_at | localeDate: 'short' } }}
    </p>

    <div class="flex justify-end">
      <p-button
        type="button"
        [label]="'COMMON.ACTIONS.CLOSE' | translate"
        (onClick)="close()"
        data-testid="device-token-dialog__btn--close"
      />
    </div>
  </div>
}
